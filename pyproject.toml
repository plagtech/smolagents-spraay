[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolagents-spraay"
version = "0.1.0"
description = "Spraay batch payment tools for smolagents: pay up to 200 recipients in one transaction on Base."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Plagtech" }]
keywords = ["smolagents", "agents", "tools", "spraay", "base", "batch-payments", "usdc", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "smolagents>=1.26.0",
    "web3>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]

[project.urls]
Homepage = "https://spraay.app"
Repository = "https://github.com/plagtech/smolagents-spraay"

[tool.hatch.build.targets.wheel]
packages = ["src/smolagents_spraay"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "gen_tools.py", "README.md", "LICENSE"]

[tool.ruff]
line-length = 119

[tool.ruff.format]
exclude = ["src/smolagents_spraay/tools.py"]  # generated by gen_tools.py

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"src/smolagents_spraay/tools.py" = ["E501"]  # generated: ABI JSON strings
"gen_tools.py" = ["E501"]  # template strings

[tool.pytest.ini_options]
markers = ["live: reads Base mainnet over the network (no transactions are sent)"]
addopts = "-m 'not live'"
